name: perf bot

# comment `/perf` on a pull request and this measures the canvas render loop on
# both the pull request and its merge base, then replies with what changed.
#
# reporting only: nothing here fails a build.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number to measure
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  measure:
    # the association check is not decoration. this job checks out the pull
    # request's code and runs pnpm install, whose postinstall runs nuxt
    # prepare, so /perf from a stranger would be arbitrary code execution
    # holding a token that can comment on the repo
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/perf') &&
       contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association))

    runs-on: ubuntu-22.04
    timeout-minutes: 25

    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      # the harness measures whatever is on this port, which is a different
      # checkout for each half of the comparison. pinned rather than left to
      # nuxt, which quietly moves to the next free port when this one is busy
      # and would leave the harness measuring nothing at all
      PORT: 3000
      PERF_URL: http://localhost:3000
      # the second server starts where the first one just stopped, and nuxt
      # holds a dev lock that outlives the process by a moment
      NUXT_IGNORE_LOCK: 1

    steps:
      - name: acknowledge the ping
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      # stays on the default branch for the whole job. the commits under test
      # are served out of worktrees instead, so the harness measuring them is
      # always this branch's, never one that may not exist on the pull request
      # or that the pull request has edited
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @graph/perf-harness exec playwright install --with-deps chromium

      # what the pull request would do to the base once merged, rather than the
      # branch on its own. github maintains that merge for us, and it is both
      # the more honest thing to measure and the only one that works: a branch
      # opened before the perf tooling landed carries no way to be measured,
      # while merging it into the base brings the tooling along
      - name: resolve what to measure
        run: |
          BASE_REF="$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)"
          git fetch -q origin "refs/pull/$PR_NUMBER/merge" || true

          if git rev-parse -q --verify FETCH_HEAD > /dev/null; then
            HEAD_SHA="$(git rev-parse FETCH_HEAD)"
            echo "measuring the pull request merged into $BASE_REF"
          else
            # closed, conflicted, or otherwise unmergeable: fall back to the
            # branch itself and let the harness say if it cannot be measured
            HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
            echo "no merge ref for #$PR_NUMBER, falling back to its head"
          fi

          {
            echo "HEAD_SHA=$HEAD_SHA"
            echo "BASE_SHA=$(git rev-parse "origin/$BASE_REF")"
          } >> "$GITHUB_ENV"

      - name: measure the pull request
        run: .github/scripts/measure-commit.sh "$HEAD_SHA" "$GITHUB_WORKSPACE/head.json"

      - name: measure the base
        run: .github/scripts/measure-commit.sh "$BASE_SHA" "$GITHUB_WORKSPACE/base.json"
        continue-on-error: true

      - name: render the report
        run: |
          if [ -f base.json ]; then
            pnpm --filter @graph/perf-harness run report \
              --head "$GITHUB_WORKSPACE/head.json" \
              --base "$GITHUB_WORKSPACE/base.json" > report.md
          else
            pnpm --filter @graph/perf-harness run report \
              --head "$GITHUB_WORKSPACE/head.json" > report.md
            echo "" >> report.md
            echo "_The base could not be measured, so there is nothing to compare against._" >> report.md
          fi

      - name: post the report
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const body = readFileSync('report.md', 'utf8');
            const marker = '<!-- magic-graphs-perf-bot -->';

            const issue_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );

            // one comment per pull request, edited in place, so pinging four
            // times leaves one current answer rather than four stale ones
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      # a job that dies quietly leaves someone watching an eyes reaction for
      # twenty minutes waiting for a comment that is never coming. say so
      - name: report the failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- magic-graphs-perf-bot -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '### canvas perf',
              '',
              `The run failed before it could measure anything. [Logs](${run}).`,
            ].join('\n');

            const issue_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );

            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
